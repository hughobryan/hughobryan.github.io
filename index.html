<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aolus</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="assets/style.css">
</head>
<body>
<div id="container">
    <div id="content">
        <div id="logo">
            <svg
                viewBox="0 0 57 52"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path d="M28.8441 0.971215C18.3924 -0.0351653 8.84429 41.742 8.84429 41.742C8.84429 41.742 18.1418 13.0008 28.9289 10.5233C35.093 9.10761 42.9973 20.9196 42.9973 20.9196C42.9973 20.9196 35.8118 1.64214 28.8441 0.971215Z" fill="#1A1A4E"/>
                <path d="M55.3288 47.3295C61.4262 38.7813 30.0202 9.62377 30.0202 9.62377C30.0202 9.62377 50.262 32.0463 47.014 42.6269C45.1581 48.673 30.9765 49.6123 30.9765 49.6123C30.9765 49.6123 51.2639 53.0283 55.3288 47.3295Z" fill="#1A1A4E"/>
                <path d="M1.29125 47.1494C5.64553 56.704 46.5997 44.0843 46.5997 44.0843C46.5997 44.0843 17.0603 50.403 9.52119 42.2998C5.2131 37.6695 11.4904 24.9182 11.4904 24.9182C11.4904 24.9182 -1.61161 40.7797 1.29125 47.1494Z" fill="#1A1A4E"/>
            </svg>
        </div>
        <p id="coming-soon">The next generation of manufacturing is upon us.</p>
    </div>
</div>
<footer>
    <button id="theme-toggle" aria-label="Toggle dark mode">
        <span id="dark-text">Dark mode</span>
        <span id="light-text">Light mode</span>
    </button>
    <p id="copyright">© 2026</p>
</footer>
<script>
    const toggle = document.getElementById('theme-toggle');
    const html = document.documentElement;

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
        html.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        html.setAttribute('data-theme', 'dark');
    }

    toggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    });
</script>
</body>
</html>
