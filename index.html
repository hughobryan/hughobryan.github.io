<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aolus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="assets/style.css">
</head>
<body>
<div id="container">
    <div id="content">
        <div id="logo">
            <svg
                viewBox="0 0 76 69"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path d="M36.8441 2.97122C26.3924 1.96483 16.8443 43.742 16.8443 43.742C16.8443 43.742 26.1418 15.0008 36.9289 12.5233C43.093 11.1076 50.9973 22.9196 50.9973 22.9196C50.9973 22.9196 43.8119 3.64214 36.8441 2.97122Z" fill="#17006C"/>
                <path d="M63.3288 49.3295C69.4262 40.7813 38.0202 11.6238 38.0202 11.6238C38.0202 11.6238 58.262 34.0463 55.014 44.6269C53.1581 50.673 38.9765 51.6123 38.9765 51.6123C38.9765 51.6123 59.2639 55.0283 63.3288 49.3295Z" fill="#17006C"/>
                <path d="M9.29125 49.1494C13.6455 58.704 54.5997 46.0843 54.5997 46.0843C54.5997 46.0843 25.0603 52.403 17.5212 44.2999C13.2131 39.6695 19.4904 26.9182 19.4904 26.9182C19.4904 26.9182 6.3884 42.7797 9.29125 49.1494Z" fill="#17006C"/>
            </svg>
        </div>
        <p id="coming-soon">The next generation of manufacturing is upon us.</p>
    </div>
</div>
<footer>
    <p id="copyright">© 2026</p>
</footer>
<button id="theme-toggle" aria-label="Toggle dark mode">
    <svg id="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
    <svg id="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
</button>
<script>
    const toggle = document.getElementById('theme-toggle');
    const html = document.documentElement;

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
        html.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        html.setAttribute('data-theme', 'dark');
    }

    toggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    });
</script>
</body>
</html>
